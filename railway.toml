# Railway config for the API service (builds the root Dockerfile).
# Dashboard service: create a second service from the same repo and set the variable
#   RAILWAY_DOCKERFILE_PATH=Dockerfile.dashboard
# plus API_URL=https://<api-service-domain>  (or http://<api-service>.railway.internal:<port>).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 90
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
