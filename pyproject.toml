[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-system"
version = "0.1.0"
description = "Credit Risk Prediction & Customer Segmentation System"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "imbalanced-learn>=0.12",
    "joblib>=1.3",
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
boosters = ["xgboost>=2.0", "lightgbm>=4.0"]

[tool.setuptools.packages.find]
include = ["ml*", "utils*", "backend*", "dashboard*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
