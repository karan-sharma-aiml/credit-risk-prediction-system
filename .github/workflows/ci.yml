name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: credit_risk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d credit_risk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ci:ci_password@localhost:5432/credit_risk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1
      - run: pip install -r requirements-dev.txt
      - name: Lint (pyflakes)
        run: python -m pyflakes ml utils backend dashboard tests
      - name: Tests (SQLite everywhere + PostgreSQL integration)
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t credit-risk-api .
      - name: Build dashboard image
        run: docker build -f Dockerfile.dashboard -t credit-risk-dashboard .
