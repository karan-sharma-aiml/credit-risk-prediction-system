# Render Blueprint: New + > Blueprint, point at this repo.
# Note: the free Postgres plan expires after a limited period; use a paid plan for production.
databases:
  - name: credit-risk-db
    databaseName: credit_risk
    user: credit_risk
    plan: free

services:
  - type: web
    name: credit-risk-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app_factory --factory --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MODEL_PATH
        value: saved_models/model_bundle.joblib
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: credit-risk-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false   # set to the dashboard URL if a browser client calls the API directly

  - type: web
    name: credit-risk-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-dashboard.txt
    startCommand: streamlit run dashboard/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: API_URL
        fromService:
          type: web
          name: credit-risk-api
          property: hostport   # host:port on Render's private network (scheme is added by the dashboard)
